<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bộ Tạo Mã Kích Hoạt Profit Engine</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 50px auto; border: 1px solid #ccc; border-radius: 8px; }
    input { width: 95%; padding: 8px; margin-bottom: 15px; font-size: 14px; }
    button { width: 100%; padding: 10px; font-size: 14px; background-color: #409eff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .result { margin-top: 20px; padding: 10px; background: #e6f7ff; color: #1890ff; font-weight: bold; text-align: center; font-size: 16px; border: 1px solid #91d5ff; word-break: break-all; user-select: all; }
  </style>
</head>
<body>
  <h2>🔑 TẠO MÃ KÍCH HOẠT PROFIT ENGINE</h2>
  <p>Nhập Extension ID nhận từ người dùng:</p>
  <input type="text" id="ext-id" placeholder="Ví dụ: jofgocgjedgphgja...">
  <button onclick="getLicenseKey()">TẠO KEY NGAY</button>
  <div id="output-key" class="result" style="display:none;"></div>

  <script>
    function getLicenseKey() {
        const id = document.getElementById('ext-id').value.trim();
        if(!id) return alert('Vui lòng nhập ID!');
        
        let hash = 0;
        const inputStr = id + "PROFIT_SALT_2026";
        for (let i = 0; i < inputStr.length; i++) {
            const char = inputStr.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash |= 0;
        }
        const generated = "KEY-" + Math.abs(hash).toString(16).toUpperCase();
        
        const out = document.getElementById('output-key');
        out.innerText = generated;
        out.style.display = 'block';
    }
  </script>
</body>
</html>
